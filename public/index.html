<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightstream | Dark Movie Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="/hls.min.js" integrity="sha384-iZBI1/lW9u8FcBjxuQ8nPTsU7TXhZNtzkV8H3gQHSTgz+VYQoKWqGlBHqhO84alJ" crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1021;
      --panel: #0f162e;
      --muted: #a9b7d0;
      --text: #f3f5ff;
      --accent: #6dd3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(109, 211, 255, 0.08), transparent 25%),
                  radial-gradient(circle at 80% 10%, rgba(245, 176, 255, 0.08), transparent 25%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 28px 48px;
    }
    .page {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand {
      font-weight: 700;
      letter-spacing: -0.02em;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .brand span {
      display: inline-flex;
      width: 14px;
      height: 14px;
      border-radius: 7px;
      background: linear-gradient(135deg, #6dd3ff, #7c6bff);
      box-shadow: 0 0 0 6px rgba(109, 211, 255, 0.18);
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pill {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.01em;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .nav-tab {
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: all 180ms ease;
    }
    .nav-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .nav-tab.active {
      background: linear-gradient(135deg, rgba(109, 211, 255, 0.2), rgba(124, 107, 255, 0.2));
      color: var(--text);
      border-color: rgba(109, 211, 255, 0.3);
    }
    .hero-section {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      margin-bottom: 32px;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .panel {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
    }
    .player-shell {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .video-wrap {
      position: relative;
      background: #0a0f1d;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #060913;
    }
    .glass {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .title {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .meta-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }
    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .synopsis {
      margin: 12px 0 4px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title .icon {
      font-size: 18px;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .field {
      flex: 1;
      min-width: 280px;
      max-width: 400px;
      position: relative;
    }
    .field input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 180ms ease;
    }
    .field input:focus {
      border-color: rgba(109, 211, 255, 0.4);
      background: rgba(255, 255, 255, 0.06);
    }
    .field .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
    }
    .content-section {
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 2 / 3;
      background: #11172d;
      transition: transform 180ms ease, box-shadow 180ms ease, border 180ms ease;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border-color: rgba(109, 211, 255, 0.3);
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 50%, rgba(6, 10, 19, 0.9) 100%);
      pointer-events: none;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.1);
    }
    .card .info {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 2;
    }
    .card .info h3 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .info p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .card .type-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--accent);
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      grid-column: 1 / -1;
    }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(109, 211, 255, 0.14);
      color: #c6ecff;
      border: 1px solid rgba(109, 211, 255, 0.3);
      font-size: 12px;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .pagination-btn {
      padding: 10px 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 180ms ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pagination-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .pagination-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .pagination-info {
      color: var(--muted);
      font-size: 14px;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(109, 211, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .featured-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      height: 100%;
      min-height: 300px;
      cursor: pointer;
      transition: all 180ms ease;
    }
    .featured-card:hover {
      transform: scale(1.01);
    }
    .featured-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .featured-card .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(11, 16, 33, 0.95) 100%);
    }
    .featured-card .content {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
    }
    .featured-card h2 {
      font-size: 28px;
      margin: 0 0 8px;
    }
    .featured-card p {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .quick-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
    .quick-item {
      display: flex;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: all 180ms ease;
    }
    .quick-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .quick-item img {
      width: 50px;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .quick-item .details {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .quick-item h4 {
      margin: 0 0 4px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .quick-item p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }
    @media (max-width: 1024px) {
      .hero-section { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      body { padding: 20px 16px 32px; }
      .field { min-width: 100%; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand" id="homeLink"><span></span>Nightstream</div>
      <div class="header-controls">
        <div class="field">
          <label class="visually-hidden" for="search">Search movies and TV shows</label>
          <div class="icon">🔎</div>
          <input id="search" type="search" placeholder="Search movies, TV shows…" aria-label="Search content">
        </div>
        <div class="pill" id="resultCount">Loading…</div>
      </div>
    </header>

    <nav class="nav-tabs" id="categoryNav">
      <button class="nav-tab active" data-category="popular">🔥 Popular</button>
      <button class="nav-tab" data-category="trending">📈 Trending</button>
      <button class="nav-tab" data-category="action">💥 Action</button>
      <button class="nav-tab" data-category="comedy">😂 Comedy</button>
      <button class="nav-tab" data-category="horror">👻 Horror</button>
      <button class="nav-tab" data-category="romance">💕 Romance</button>
    </nav>

    <section class="hero-section" id="heroSection">
      <div class="panel player-shell">
        <div class="video-wrap">
          <video id="video" controls playsinline preload="metadata" aria-label="Nightstream video player"></video>
        </div>
        <div class="glass">
          <div class="meta-line" id="statusRow">
            <span class="badge" id="streamStatus">Ready</span>
            <span id="metaRuntime"></span>
            <span id="metaRating"></span>
          </div>
          <h2 class="title" id="metaTitle">Select a title to play</h2>
          <div class="meta-line" id="metaTags"></div>
          <p class="synopsis" id="metaSynopsis">Browse the catalog below and click on any movie or TV show to start streaming.</p>
        </div>
      </div>
      <div class="panel">
        <div class="section-header">
          <h3 class="section-title"><span class="icon">⚡</span> Quick Play</h3>
        </div>
        <div class="quick-list" id="quickList">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </section>

    <section class="content-section" id="catalogSection">
      <div class="section-header">
        <h2 class="section-title" id="catalogTitle"><span class="icon">🎬</span> <span id="categoryLabel">Popular</span></h2>
      </div>
      <div id="grid" class="grid">
        <div class="loading"><div class="spinner"></div></div>
      </div>
      <div class="empty" id="emptyState" hidden>No content found. Try a different search or category.</div>
      <div class="pagination" id="pagination" hidden>
        <button class="pagination-btn" id="prevBtn" disabled>← Previous</button>
        <span class="pagination-info" id="pageInfo">Page 1</span>
        <button class="pagination-btn" id="nextBtn">Next →</button>
      </div>
    </section>
  </div>

  <script>
    const state = {
      movies: [],
      activeId: null,
      currentPage: 1,
      hasMore: false,
      currentCategory: 'popular',
      currentSearch: '',
      isLoading: false
    };

    // Constants for fallback content
    const FALLBACK_POSTER = 'https://via.placeholder.com/300x450?text=No+Poster';
    const FALLBACK_POSTER_SMALL = 'https://via.placeholder.com/50x75?text=N/A';
    const FALLBACK_TITLE = 'Unknown Title';

    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const emptyState = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');
    const titleEl = document.getElementById('metaTitle');
    const tagsEl = document.getElementById('metaTags');
    const synopsisEl = document.getElementById('metaSynopsis');
    const runtimeEl = document.getElementById('metaRuntime');
    const ratingEl = document.getElementById('metaRating');
    const statusEl = document.getElementById('streamStatus');
    const video = document.getElementById('video');
    const quickList = document.getElementById('quickList');
    const categoryNav = document.getElementById('categoryNav');
    const categoryLabel = document.getElementById('categoryLabel');
    const pagination = document.getElementById('pagination');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageInfo = document.getElementById('pageInfo');
    const homeLink = document.getElementById('homeLink');
    let hlsPlayer;
    let searchTimeout;

    async function fetchMovies(query = 'popular', page = 1) {
      state.isLoading = true;
      showLoading();

      try {
        const params = new URLSearchParams({ q: query, page: page.toString(), size: '18' });
        const res = await fetch(`/api/movies?${params.toString()}`);
        const payload = await res.json();

        state.movies = payload.data || [];
        state.currentPage = payload.pagination?.page || page;
        state.hasMore = payload.pagination?.hasMore || false;

        renderCards(state.movies);
        updatePagination();
        updateQuickList();
      } catch (error) {
        console.error('Failed to fetch movies:', error);
        showError('Failed to load content. Please try again.');
      } finally {
        state.isLoading = false;
      }
    }

    function showLoading() {
      grid.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      emptyState.hidden = true;
      pagination.hidden = true;
    }

    function showError(message) {
      grid.innerHTML = '';
      emptyState.textContent = message;
      emptyState.hidden = false;
    }

    function renderCards(list) {
      grid.innerHTML = '';
      emptyState.hidden = list.length > 0;
      pagination.hidden = list.length === 0;
      resultCount.textContent = `${list.length} title${list.length === 1 ? '' : 's'}`;

      if (list.length === 0) {
        emptyState.textContent = state.currentSearch
          ? `No results found for "${state.currentSearch}"`
          : 'No content available in this category.';
        return;
      }

      list.forEach((movie) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('tabindex', '0');
        card.dataset.id = movie.id;

        const posterUrl = movie.poster || FALLBACK_POSTER;
        const mediaType = movie.mediaType === 'tv' ? 'TV' : 'Movie';
        const title = movie.title || FALLBACK_TITLE;

        card.innerHTML = `
          <span class="type-badge">${mediaType}</span>
          <img src="${posterUrl}" alt="${title} poster" loading="lazy" onerror="this.src='${FALLBACK_POSTER}'">
          <div class="info">
            <h3>${title}</h3>
            <p>${movie.year || ''} ${movie.runtime ? '· ' + movie.runtime : ''}</p>
          </div>
        `;

        card.addEventListener('click', () => playMovie(movie.id));
        card.addEventListener('keypress', (evt) => {
          if (evt.key === 'Enter' || evt.key === ' ') {
            evt.preventDefault();
            playMovie(movie.id);
          }
        });

        grid.appendChild(card);
      });
    }

    function updateQuickList() {
      const items = state.movies.slice(0, 5);
      if (items.length === 0) {
        quickList.innerHTML = '<div class="empty">No items available</div>';
        return;
      }

      quickList.innerHTML = items.map((movie) => {
        const posterUrl = movie.poster || FALLBACK_POSTER_SMALL;
        const title = movie.title || FALLBACK_TITLE;
        return `
          <div class="quick-item" data-id="${movie.id}">
            <img src="${posterUrl}" alt="${title}" loading="lazy" onerror="this.src='${FALLBACK_POSTER_SMALL}'">
            <div class="details">
              <h4>${title}</h4>
              <p>${movie.year || ''} · ${movie.mediaType === 'tv' ? 'TV Show' : 'Movie'}</p>
            </div>
          </div>
        `;
      }).join('');

      quickList.querySelectorAll('.quick-item').forEach((item) => {
        item.addEventListener('click', () => playMovie(item.dataset.id));
      });
    }

    function updatePagination() {
      prevBtn.disabled = state.currentPage <= 1;
      nextBtn.disabled = !state.hasMore;
      pageInfo.textContent = `Page ${state.currentPage}`;
      pagination.hidden = state.movies.length === 0;
    }

    function setStatus(text, intent = 'info') {
      statusEl.textContent = text;
      statusEl.style.background = intent === 'error'
        ? 'rgba(255, 142, 142, 0.14)'
        : 'rgba(109, 211, 255, 0.14)';
      statusEl.style.color = intent === 'error' ? '#ffd4d4' : '#c6ecff';
      statusEl.style.borderColor = intent === 'error'
        ? 'rgba(255, 142, 142, 0.3)'
        : 'rgba(109, 211, 255, 0.3)';
    }

    function resetPlayer() {
      if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
      }
      video.removeAttribute('src');
    }

    function handleAutoplayError() {
      setStatus('Press play to start', 'info');
    }

    async function playMovie(id) {
      const movie = state.movies.find((item) => item.id === id);
      if (!movie) return;

      state.activeId = id;
      titleEl.textContent = movie.title || FALLBACK_TITLE;
      tagsEl.innerHTML = [
        movie.year ? `<span class="chip">${movie.year}</span>` : '',
        movie.mediaType ? `<span class="chip">${movie.mediaType === 'tv' ? 'TV Show' : 'Movie'}</span>` : '',
        movie.rating ? `<span class="chip">${movie.rating}</span>` : ''
      ].filter(Boolean).join('');
      synopsisEl.textContent = movie.synopsis || 'No synopsis available.';
      runtimeEl.textContent = movie.runtime ? `Runtime: ${movie.runtime}` : '';
      ratingEl.textContent = '';
      setStatus('Loading stream…');

      resetPlayer();

      // Scroll to player on mobile
      if (window.innerWidth < 1024) {
        document.getElementById('heroSection').scrollIntoView({ behavior: 'smooth' });
      }

      try {
        const stream = await loadStream(movie);

        if (!stream || !stream.url) {
          throw new Error('No stream URL available');
        }

        if (window.Hls && Hls.isSupported()) {
          hlsPlayer = new Hls({
            enableWorker: true,
            xhrSetup: (xhr) => {
              if (stream.headers) {
                Object.entries(stream.headers).forEach(([key, value]) => {
                  xhr.setRequestHeader(key, value);
                });
              }
            }
          });
          hlsPlayer.loadSource(stream.url);
          hlsPlayer.attachMedia(video);
          hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(handleAutoplayError);
          });
          hlsPlayer.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
              setStatus('Stream error. Try another quality.', 'error');
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = stream.url;
          video.play().catch(handleAutoplayError);
        } else {
          setStatus('HLS not supported in this browser.', 'error');
          return;
        }

        setStatus(`Streaming: ${stream.quality || 'Auto'}`, 'info');
      } catch (error) {
        console.error('Playback error:', error);
        setStatus('Stream unavailable. Try another title.', 'error');
      }
    }

    async function loadStream(movie) {
      if (!movie.id) return null;

      const params = new URLSearchParams({
        tmdbId: movie.id,
        type: movie.mediaType || 'movie'
      });

      if (movie.season) params.set('season', movie.season);
      if (movie.episode) params.set('episode', movie.episode);

      const res = await fetch(`/api/streams?${params.toString()}`);
      if (!res.ok) throw new Error('Stream lookup failed');

      const payload = await res.json();
      const stream = (payload.data || [])[0];
      return stream || null;
    }

    function handleCategoryChange(category) {
      state.currentCategory = category;
      state.currentPage = 1;
      state.currentSearch = '';
      search.value = '';

      categoryNav.querySelectorAll('.nav-tab').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.category === category);
      });

      const labels = {
        popular: 'Popular',
        trending: 'Trending',
        action: 'Action Movies',
        comedy: 'Comedy',
        horror: 'Horror',
        romance: 'Romance'
      };
      categoryLabel.textContent = labels[category] || category;

      fetchMovies(category, 1);
    }

    function handleSearch(query) {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        state.currentSearch = query.trim();
        state.currentPage = 1;

        if (state.currentSearch) {
          categoryLabel.textContent = `Search: "${state.currentSearch}"`;
          categoryNav.querySelectorAll('.nav-tab').forEach((tab) => {
            tab.classList.remove('active');
          });
          fetchMovies(state.currentSearch, 1);
        } else {
          handleCategoryChange(state.currentCategory);
        }
      }, 400);
    }

    // Event Listeners
    categoryNav.addEventListener('click', (e) => {
      if (e.target.classList.contains('nav-tab')) {
        handleCategoryChange(e.target.dataset.category);
      }
    });

    search.addEventListener('input', (e) => {
      handleSearch(e.target.value);
    });

    prevBtn.addEventListener('click', () => {
      if (state.currentPage > 1) {
        const query = state.currentSearch || state.currentCategory;
        fetchMovies(query, state.currentPage - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (state.hasMore) {
        const query = state.currentSearch || state.currentCategory;
        fetchMovies(query, state.currentPage + 1);
      }
    });

    homeLink.addEventListener('click', () => {
      state.currentSearch = '';
      search.value = '';
      handleCategoryChange('popular');
    });

    // Initialize
    fetchMovies('popular', 1);
  </script>
</body>
</html>
